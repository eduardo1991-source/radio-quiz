<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Radio Exam Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #111;
  --muted: #666;
  --ok: #2e7d32;
  --bad: #c62828;
  --accent: #1e88e5;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --text: #f5f5f5;
    --muted: #aaa;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: 600px;
  margin: auto;
  background: var(--card);
  padding: 16px;
  border-radius: 12px;
}

/* ---------- MENU ---------- */

.menu button {
  width: 100%;
  padding: 14px;
  margin-bottom: 10px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  background: var(--accent);
  color: #fff;
}

/* ---------- QUIZ ---------- */

.hidden {
  display: none;
}

#progress {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 6px;
}

#timer {
  font-weight: bold;
  margin-bottom: 10px;
}

h2 {
  font-size: 18px;
}

.option {
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 10px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.option.correct {
  background: var(--ok);
  color: #fff;
}

.option.incorrect {
  background: var(--bad);
  color: #fff;
}

#explanation {
  margin-top: 12px;
  padding: 10px;
  background: rgba(0,0,0,0.05);
  border-radius: 8px;
  font-size: 14px;
}

button.secondary {
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  width: 100%;
}
</style>
</head>

<body>

<div class="container">

<!-- ===== MENU ===== -->
<div id="menu" class="menu">
  <button onclick="startMode('study')">Study</button>
  <button onclick="startMode('browse')">Browse</button>
  <button onclick="startMode('wrong')">Wrong only</button>
  <button onclick="showTestMenu()">Test</button>
</div>

<!-- ===== TEST MENU ===== -->
<div id="testMenu" class="menu hidden">
  <button onclick="startTest('foundation')">Foundation</button>
  <button onclick="startTest('intermediate')">Intermediate</button>
  <button onclick="startTest('full')">Full</button>
  <button onclick="startTest('mixed')">Mixed</button>
  <button class="secondary" onclick="backToMenu()">Back</button>
</div>

<!-- ===== QUIZ ===== -->
<div id="quiz" class="hidden">
  <div id="progress"></div>
  <div id="timer"></div>

  <h2 id="question"></h2>
  <img id="questionImage" style="max-width:100%; display:none; margin-bottom:10px;">

  <div id="options"></div>

  <div id="explanation" style="display:none;"></div>

  <button class="secondary" onclick="nextQuestion()">Next</button>
  <button class="secondary" onclick="backToMenu()">Back to menu</button>
</div>

</div>

<script>
/* ===== CONFIG ===== */
const QUESTION_FILES = [
  "files/chapter1_foundation.json",
  "files/chapter2_foundation.json"
];

const TEST_SIZE = 75;
const EXAM_TIME_MINUTES = 150;

/* ===== STATE ===== */
let questionsAll = [];
let questions = [];
let current = 0;
let answered = false;
let testMode = false;
let testProfile = null;
let examTimer = null;

/* ===== LOAD ===== */
Promise.all(QUESTION_FILES.map(f => fetch(f).then(r => r.json())))
  .then(data => questionsAll = data.flat());

/* ===== UI ===== */
function startMode(mode) {
  testMode = false;
  questions = questionsAll;
  shuffle(questions);
  current = 0;
  showQuiz();
}

function showTestMenu() {
  hideAll();
  document.getElementById("testMenu").classList.remove("hidden");
}

function backToMenu() {
  if (examTimer) clearInterval(examTimer);
  hideAll();
  document.getElementById("menu").classList.remove("hidden");
}

function showQuiz() {
  hideAll();
  document.getElementById("quiz").classList.remove("hidden");
  loadQuestion();
}

function hideAll() {
  document.querySelectorAll(".menu, #quiz").forEach(e => e.classList.add("hidden"));
}

/* ===== QUIZ ===== */
function loadQuestion() {
  answered = false;
  const q = questions[current];

  document.getElementById("progress").innerText =
    `Question ${current + 1} / ${questions.length}`;

  document.getElementById("question").innerText = q.question;

  const img = document.getElementById("questionImage");
  if (q.image) {
    img.src = "files/images/" + q.image;
    img.style.display = "block";
  } else {
    img.style.display = "none";
  }

  const opts = document.getElementById("options");
  opts.innerHTML = "";

  for (let k in q.options) {
    const d = document.createElement("div");
    d.className = "option";
    d.innerText = `${k}: ${q.options[k]}`;

    d.addEventListener("pointerdown", () => selectAnswer(d, k), { passive: true });
    opts.appendChild(d);
  }

  document.getElementById("explanation").style.display = "none";
}

function selectAnswer(div, key) {
  if (answered) return;
  answered = true;

  const q = questions[current];

  document.querySelectorAll(".option").forEach(o => {
    if (o.innerText.startsWith(q.correct)) {
      o.classList.add("correct");
    }
  });

  if (key !== q.correct) {
    div.classList.add("incorrect");
  }

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const e = document.getElementById("explanation");
      e.innerText = q.explanation;
      e.style.display = "block";
    });
  });
}

function nextQuestion() {
  current++;
  if (current >= questions.length) current = 0;
  loadQuestion();
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
}
</script>

</body>
</html>
